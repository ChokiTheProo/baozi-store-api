spring.application.name=baozi-store-api
server.port=8080

# Banco relacional H2 salvo em arquivo (os dados continuam apos reiniciar a API)
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
