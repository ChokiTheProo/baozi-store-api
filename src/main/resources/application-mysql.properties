# Perfil opcional para usar MySQL no lugar do H2.
# Ativar com: iniciar-api-mysql.cmd  (ou --spring.profiles.active=mysql)
# O banco "baozi_store" e criado automaticamente se nao existir.
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.h2.console.enabled=false
